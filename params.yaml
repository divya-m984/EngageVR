# EngageVR -- reproducible-pipeline parameters (Milestone 10)
#
# The single source of truth for the deterministic SYNTHETIC software
# demo. `dvc.yaml` templates from this file, and
# `engagevr.mlops.pipeline` reads it, so the DAG and the in-process
# `mlops-demo` orchestrator cannot disagree about what the demo is.
#
# EVERY VALUE HERE DESCRIBES A SOFTWARE SELF-CHECK. The datasets are
# generated by this repository from a known latent process; no person was
# recorded, no label was provided by a participant, and no number the
# pipeline produces is model accuracy, engagement validity,
# cognitive-load validity, or evidence of any kind.
#
# The sizes are deliberately small. This pipeline exists to be re-run --
# on a laptop, in CI, and from a clean clone -- and a demo nobody waits
# for is a demo nobody reproduces.

pipeline:
  # Seed for the REFERENCE dataset: the one the models are fitted and
  # evaluated on.
  reference_seed: 42

  # Seed for the CURRENT dataset: a second SYNTHETIC draw that exists
  # only to give the distribution-shift diagnostic two explicitly named
  # sides. It must differ from reference_seed; comparing a draw with
  # itself would report a shift that could never be anything but zero.
  current_seed: 1337

  subjects: 24
  sessions_per_subject: 2
  windows_per_session: 8
  window_seconds: 10.0
  step_seconds: 10.0

  # The target the baseline and uncertainty stages model. One target
  # keeps the DAG legible; the other three are reachable through the
  # Milestone 5 and Milestone 7 commands directly.
  target: "engagement_class"

  # Outer folds. Grouped by subject, as Milestone 5 requires: three folds
  # over 24 synthetic subjects leaves eight held-out subjects per fold.
  folds: 3
