repos:
  # Pinned to the same ruff the project depends on. A mismatch makes
  # 'pre-commit run' and 'make lint' disagree: rules are added and removed
  # between ruff releases, so an older hook can fail code the project's own
  # linter accepts.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # dvc.lock is EXCLUDED from both whitespace hooks. DVC owns that
      # file's formatting and wraps long commands with a trailing space on
      # every continued line -- 22 of them. Stripping those makes the
      # committed lock differ from the one `dvc repro` produces, so the CI
      # step `dvc.lock is byte-stable across a fresh reproduction` fails on
      # a whitespace edit nobody made deliberately. A formatter must never
      # rewrite a generated lock file; see DEC-100 and DEC-105.
      - id: trailing-whitespace
        exclude: ^dvc\.lock$
      - id: end-of-file-fixer
        exclude: ^dvc\.lock$
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
