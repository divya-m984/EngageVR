repos:
  # Pinned to the same ruff the project depends on. A mismatch makes
  # 'pre-commit run' and 'make lint' disagree: rules are added and removed
  # between ruff releases, so an older hook can fail code the project's own
  # linter accepts.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
