[project]
name = "engagevr"
version = "0.1.0"
description = "An uncertainty-aware multimodal research prototype for engagement estimation, cognitive-load estimation, and adaptive virtual environments."
readme = "README.md"
authors = [
    { name = "divya-m984", email = "182434568+divya-m984@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11,<3",
    "pyyaml>=6.0,<7",
    "numpy>=2,<3",
    "opencv-contrib-python>=4.9,<6",
    "mediapipe>=0.10.14,<2",
    "scipy>=1.15,<2",
    "fastapi>=0.141,<1",
    "uvicorn>=0.35,<1",
    "websockets>=15,<18",
    "scikit-learn>=1.6,<2",
    "pandas>=2.2,<3.0.4",
    "pyarrow>=17,<26",
    "joblib>=1.4,<2",
    "streamlit>=1.62,<2",
    "dvc>=3.67,<4",
    "mlflow-skinny>=3.15,<4",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.12,<1",
    "mypy>=1.16,<2",
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "pre-commit>=4,<5",
    "types-PyYAML>=6,<7",
    "scipy-stubs>=1.15,<2",
    "httpx2>=2.9,<3",
    "pytest-asyncio>=1.0,<2",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["engagevr"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# None of these distributions ships a `py.typed` marker, so mypy cannot see
# their signatures. Verified for the pinned versions: mediapipe 1.0.0,
# opencv 5.0.0, scikit-learn 1.9.0, pandas 3.0.5, pyarrow 25.0.0,
# joblib 1.5.3. Every value crossing one of these boundaries is explicitly
# annotated or narrowed on the EngageVR side, so `warn_return_any` still
# has something to check.
module = [
    "mediapipe.*",
    "cv2",
    "sklearn.*",
    "pandas",
    "pyarrow",
    "pyarrow.*",
    "joblib",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The two rule-based software-check baselines must subclass scikit-learn's
# BaseEstimator and the task mixins to be usable inside a Pipeline, and
# those base classes are untyped (see the override above), so mypy sees a
# subclass of `Any`. The relaxation is confined to this one module; every
# public function in it is still fully annotated.
module = ["engagevr.training.models"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow",
    "hardware: requires physical webcam (deselect with -m 'not hardware')",
    "dvc_system: reproduces the DVC pipeline in two fresh source trees (~6 min); opt-in via ENGAGEVR_RUN_DVC_SYSTEM_TESTS=1",
]
filterwarnings = ["ignore::DeprecationWarning:google.protobuf.*"]

[tool.coverage.run]
source = ["engagevr"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
