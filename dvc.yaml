# EngageVR -- reproducible software demo (Milestone 10)
#
# WHAT THIS IS
# ------------
# A deterministic pipeline over SYNTHETIC data that a clean clone can run
# with no remote, no account, and no network:
#
#     uv sync --locked
#     uv run dvc repro
#
# Every stage invokes an existing Milestone 5-9 subcommand through the
# public CLI. There is no modelling logic in this file and none in
# `engagevr.mlops`: the DAG orchestrates, the runners model.
#
# WHAT IT IS NOT
# --------------
# SOFTWARE SELF-CHECK -- NOT SCIENTIFIC EVALUATION. Every dataset here is
# generated by this repository from a known latent process. No person was
# recorded, no participant provided a label, and no number produced by
# this pipeline is model accuracy, engagement validity, cognitive-load
# validity, or evidence of any kind. Every artifact it writes carries
# scientific_evaluation_eligible=false.
#
# OUTPUTS ARE NOT TRACKED BY DVC
# ------------------------------
# Every `outs` entry is declared `cache: false`. The software demo is
# regenerated from source, not restored from a cache or a remote: there
# is nothing to `dvc pull`, no remote to configure, and no binary in Git.
# The outputs land under artifacts/pipeline/, which is gitignored.
#
# EVERY DECLARED OUTPUT IS BYTE-STABLE, AND SO IS dvc.lock
# --------------------------------------------------------
# The invariant this file maintains:
#
#     clean source tree -> dvc repro -> dvc.lock byte-identical
#
# given the same source, uv.lock, configuration, synthetic seed, and
# parameters. dvc.lock is tracked, and a fresh reproduction leaves it
# unchanged.
#
# That needs a boundary, because the Milestone 5-8 runners legitimately
# write timestamped provenance -- manifest.json records started_at_utc and
# finished_at_utc, dataset metadata records created_at_utc -- and
# rewriting those semantics to please a build tool would be the wrong
# repair. So:
#
#     existing runner output      timestamped, intact, NOT declared here
#               |
#     deterministic stage record  engagevr stage-record
#               |
#     DVC-declared output         byte-stable, hashed into dvc.lock
#
# The `baseline` and `uncertainty` stages therefore declare a stage record
# rather than their run directory. The record pins the run id and
# checksums every byte-stable file the run produced; the timestamped
# documents are listed by path and reason, never checksummed. A
# meaningful change still propagates -- alter metrics.json and the
# record's checksum for it changes, so the record changes, so dvc.lock
# changes and every downstream stage re-runs. What no longer propagates
# is the clock.
#
# Milestone 10's own documents carry no wall clock at all. When each was
# produced is recorded in a .execution.json sidecar beside it, which is
# never a declared output. See docs/MLOPS.md and DEC-100.
#
# A second `dvc repro` is a no-op: DVC re-runs a stage when its
# dependencies, parameters, or command change, and none of those carries
# a timestamp either.

stages:
  # ---------------------------------------------------------------- data
  dataset-reference:
    desc: >-
      Generate the deterministic SYNTHETIC windowed-feature dataset the
      models are fitted and evaluated on.
    cmd:
      - >-
        uv run python -m engagevr features-demo
        --seed ${pipeline.reference_seed}
        --subjects ${pipeline.subjects}
        --sessions-per-subject ${pipeline.sessions_per_subject}
        --windows-per-session ${pipeline.windows_per_session}
        --window-seconds ${pipeline.window_seconds}
        --step-seconds ${pipeline.step_seconds}
        --output artifacts/pipeline/datasets/reference.parquet
      - >-
        uv run python -m engagevr stage-record
        --stage dataset-reference
        --pipeline-root artifacts/pipeline
        --target ${pipeline.target}
    deps:
      - src/engagevr/features
      - src/engagevr/schemas/features.py
      - src/engagevr/cli_milestone5.py
      - src/engagevr/mlops/stage_record.py
      - configs/defaults.yaml
    params:
      - pipeline.target
      - pipeline.reference_seed
      - pipeline.subjects
      - pipeline.sessions_per_subject
      - pipeline.windows_per_session
      - pipeline.window_seconds
      - pipeline.step_seconds
    # reference.metadata.json is produced but NOT declared: it records
    # created_at_utc. Its dataset_fingerprint is what the stage record
    # pins, so the dataset's identity is still in the lock.
    outs:
      - artifacts/pipeline/datasets/reference.parquet:
          cache: false
      - artifacts/pipeline/datasets/reference.feature_catalog.json:
          cache: false
      - artifacts/pipeline/mlops/stages/dataset-reference.json:
          cache: false

  dataset-current:
    desc: >-
      A second SYNTHETIC draw, used only to give the distribution-shift
      diagnostic two explicitly named sides. It is never modelled.
    cmd:
      - >-
        uv run python -m engagevr features-demo
        --seed ${pipeline.current_seed}
        --subjects ${pipeline.subjects}
        --sessions-per-subject ${pipeline.sessions_per_subject}
        --windows-per-session ${pipeline.windows_per_session}
        --window-seconds ${pipeline.window_seconds}
        --step-seconds ${pipeline.step_seconds}
        --output artifacts/pipeline/datasets/current.parquet
      - >-
        uv run python -m engagevr stage-record
        --stage dataset-current
        --pipeline-root artifacts/pipeline
        --target ${pipeline.target}
    deps:
      - src/engagevr/features
      - src/engagevr/schemas/features.py
      - src/engagevr/cli_milestone5.py
      - src/engagevr/mlops/stage_record.py
      - configs/defaults.yaml
    params:
      - pipeline.target
      - pipeline.current_seed
      - pipeline.subjects
      - pipeline.sessions_per_subject
      - pipeline.windows_per_session
      - pipeline.window_seconds
      - pipeline.step_seconds
    outs:
      - artifacts/pipeline/datasets/current.parquet:
          cache: false
      - artifacts/pipeline/datasets/current.feature_catalog.json:
          cache: false
      - artifacts/pipeline/mlops/stages/dataset-current.json:
          cache: false

  # ------------------------------------------------------------ modelling
  baseline:
    desc: >-
      Milestone 5 interpretable baselines with grouped cross-validation,
      calibration, ablations, and a full artifact set. Training and
      evaluation are one stage because the runner performs them as one
      operation; splitting them here would mean re-fitting to score.
    cmd:
      - >-
        uv run python -m engagevr baseline-demo
        --dataset artifacts/pipeline/datasets/reference.parquet
        --target ${pipeline.target}
        --folds ${pipeline.folds}
        --seed ${pipeline.reference_seed}
        --output artifacts/pipeline/experiments/baseline-${pipeline.target}
      - >-
        uv run python -m engagevr stage-record
        --stage baseline
        --pipeline-root artifacts/pipeline
        --target ${pipeline.target}
    deps:
      - artifacts/pipeline/datasets/reference.parquet
      - src/engagevr/training
      - src/engagevr/cli_milestone5.py
      - src/engagevr/mlops/stage_record.py
      - configs/defaults.yaml
    params:
      - pipeline.target
      - pipeline.folds
      - pipeline.reference_seed
    # The run directory is produced but NOT declared: manifest.json,
    # dataset.json, and checksums.json record when the run happened. The
    # stage record pins its run_id and checksums every byte-stable file
    # it wrote, models included.
    outs:
      - artifacts/pipeline/mlops/stages/baseline.json:
          cache: false

  uncertainty:
    desc: >-
      Milestone 7 calibrated confidence, split-conformal intervals,
      selective prediction, abstention, and the adaptation gate.
    cmd:
      - >-
        uv run python -m engagevr uncertainty-demo
        --dataset artifacts/pipeline/datasets/reference.parquet
        --target ${pipeline.target}
        --folds ${pipeline.folds}
        --seed ${pipeline.reference_seed}
        --output artifacts/pipeline/experiments/uncertainty-${pipeline.target}
      - >-
        uv run python -m engagevr stage-record
        --stage uncertainty
        --pipeline-root artifacts/pipeline
        --target ${pipeline.target}
    deps:
      - artifacts/pipeline/datasets/reference.parquet
      - src/engagevr/training
      - src/engagevr/cli_milestone7.py
      - src/engagevr/mlops/stage_record.py
      - configs/defaults.yaml
    params:
      - pipeline.target
      - pipeline.folds
      - pipeline.reference_seed
    outs:
      - artifacts/pipeline/mlops/stages/uncertainty.json:
          cache: false

  # ---------------------------------------------------- versioning + checks
  model-version:
    desc: >-
      Derive one immutable, checksum-linked version record per persisted
      estimator. Reads the run; never loads a model file; never writes
      into the run directory.
    cmd: >-
      uv run python -m engagevr model-manifest
      --run artifacts/pipeline/experiments/baseline-${pipeline.target}
      --output artifacts/pipeline/mlops/model_versions
      --verify
    deps:
      - artifacts/pipeline/mlops/stages/baseline.json
      - src/engagevr/mlops/model_version.py
      - src/engagevr/schemas/mlops.py
      - configs/defaults.yaml
    # Every version record is byte-stable: it carries no creation time.
    # model_versions.execution.json sits beside the directory, not in it.
    outs:
      - artifacts/pipeline/mlops/model_versions:
          cache: false

  drift:
    desc: >-
      Distribution-shift diagnostic between the two SYNTHETIC draws. A
      diagnostic, not a diagnosis: a shift is not model degradation, not
      concept drift, and not a change in any person's state.
    cmd: >-
      uv run python -m engagevr drift-check
      --reference artifacts/pipeline/datasets/reference.parquet
      --current artifacts/pipeline/datasets/current.parquet
      --output artifacts/pipeline/mlops/drift_report.json
    deps:
      - artifacts/pipeline/datasets/reference.parquet
      - artifacts/pipeline/datasets/current.parquet
      - src/engagevr/mlops/drift.py
      - src/engagevr/schemas/mlops.py
      - configs/defaults.yaml
    outs:
      - artifacts/pipeline/mlops/drift_report.json:
          cache: false

  integrity:
    desc: >-
      Milestone 9 read-only catalogue over the pipeline's runs: family
      detection by artifact signature, run status, and checksum
      verification. Starts no server and writes nothing of its own.
    cmd: >-
      uv run python -m engagevr dashboard-check
      --artifact-root artifacts/pipeline/experiments
      --json > artifacts/pipeline/mlops/catalogue.json
    deps:
      - artifacts/pipeline/mlops/stages/baseline.json
      - artifacts/pipeline/mlops/stages/uncertainty.json
      - src/engagevr/dashboard/catalogue.py
      - src/engagevr/cli_milestone9.py
    outs:
      - artifacts/pipeline/mlops/catalogue.json:
          cache: false

  reproducibility:
    desc: >-
      Record the package versions, the effective configuration
      fingerprint, every stage's logical identity, and the checksums of
      the outputs declared byte-deterministic. Wall clocks, absolute
      paths, and MLflow identifiers are excluded from identity.
    cmd: >-
      uv run python -m engagevr repro-manifest
      --pipeline-root artifacts/pipeline
      --target ${pipeline.target}
      --output artifacts/pipeline/mlops/reproducibility.json
    deps:
      - artifacts/pipeline/mlops/stages/dataset-reference.json
      - artifacts/pipeline/mlops/stages/dataset-current.json
      - artifacts/pipeline/mlops/stages/baseline.json
      - artifacts/pipeline/mlops/stages/uncertainty.json
      - artifacts/pipeline/mlops/model_versions
      - artifacts/pipeline/mlops/drift_report.json
      - artifacts/pipeline/mlops/catalogue.json
      - src/engagevr/mlops/reproducibility.py
      - src/engagevr/mlops/pipeline.py
      - params.yaml
    outs:
      - artifacts/pipeline/mlops/reproducibility.json:
          cache: false
