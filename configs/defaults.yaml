# EngageVR default configuration
# All values are overridable per-session or per-experiment.

project:
  name: "EngageVR"
  version: "0.1.0"

capture:
  camera_index: 0
  width: 640
  height: 480
  webcam_fps_target: 30
  store_raw_video: false   # privacy: disabled by default
  preview: false

face:
  model_path: "models/face_landmarker.task"
  min_detection_confidence: 0.5
  min_presence_confidence: 0.5
  min_tracking_confidence: 0.5
  blink_ear_threshold: 0.21
  eye_closure_min_frames: 3

head_pose:
  velocity_window_seconds: 1.0

quality:
  brightness_low: 40.0
  brightness_high: 220.0
  blur_threshold: 100.0
  motion_threshold: 30.0

# --- Remote photoplethysmography (rPPG) ---
# Heart-rate outputs are signal-processing ESTIMATES from camera data.
# They are not medical measurements and are not engagement or cognitive load.
rppg:
  method: "pos"            # green | chrom | pos

  roi:
    regions: ["forehead", "left_cheek", "right_cheek"]
    inset_fraction: 0.15   # trim toward centre: excludes hair, brows, eyes, nostrils
    min_valid_pixels: 200
    min_valid_pixel_pct: 60.0
    clipping_low: 5        # <= this is crushed black
    clipping_high: 250     # >= this is saturated

  trace:
    expected_fps: 30.0
    max_timestamp_jitter_s: 0.02
    min_valid_frame_pct: 80.0

  window:
    duration_seconds: 30.0    # specification recommends 20-30 s
    step_seconds: 1.0
    min_duration_seconds: 8.0

  preprocessing:
    detrend: true
    normalize: true
    resample_uniform: true
    filter_order: 4
    # 0.7-4.0 Hz = 42-240 BPM, following the 40-240 BPM pulse range used by
    # de Haan & Jeanne (2013), DOI 10.1109/TBME.2013.2266196.
    pulse_band_low_hz: 0.7
    pulse_band_high_hz: 4.0

  spectral:
    welch_segment_seconds: 8.0
    welch_overlap: 0.5
    peak_bandwidth_hz: 0.1
    min_relative_peak_prominence: 0.3
    min_spectral_peak_ratio: 0.15

  quality:
    threshold: 0.5           # below this, heart rate is reported unavailable
    max_illumination_cv: 0.05
    max_clipped_pixel_pct: 5.0
    max_motion_score: 30.0
    method_agreement_tolerance_bpm: 10.0

  datasets:
    # Nothing is downloaded automatically. See docs/DATASETS.md.
    ubfc_rppg_root: null

windowing:
  facial_aggregate_seconds: 5.0
  rppg_window_seconds: 30.0
  model_inference_seconds: 5.0
  baseline_calibration_seconds: 120.0

signal_quality:
  min_face_detection_confidence: 0.5
  min_rppg_quality: 0.3
  min_hrv_window_seconds: 60.0   # do not compute HRV below this

model:
  confidence_threshold: 0.5
  abstain_below_confidence: 0.3

adaptation:
  enabled: true
  cooldown_seconds: 30.0
  max_difficulty_change: 1
  require_min_signal_quality: 0.4
  require_min_confidence: 0.4

logging:
  level: "INFO"
  format: "json"
  file: null   # null = stderr only

session:
  data_dir: "data"
  synthetic_dir: "data/synthetic"

# --- Milestone 4: local real-time bridge, task simulator, storage, replay ---
# This prototype has NO authentication, authorization, or transport
# encryption. It is a localhost development server and must not be exposed.

server:
  host: "127.0.0.1"          # loopback only
  port: 8000
  allow_public_bind: false   # required before binding a non-loopback address
  maximum_message_bytes: 262144
  heartbeat_interval_seconds: 10.0
  connection_timeout_seconds: 30.0   # must exceed the heartbeat interval
  acknowledgement_timeout_seconds: 5.0

protocol:
  version: "1.0"
  accepted_major_versions: [1]
  maximum_clock_skew_seconds: 5.0
  maximum_sequence_gap: 1000
  maximum_transport_delay_seconds: 2.0

queues:
  # Every queue is bounded. A full queue drops non-critical telemetry and
  # counts the drop; it never blocks the process indefinitely and never
  # drops session_start, session_end, adaptation_command,
  # adaptation_acknowledgement, protocol_error, or task_completed.
  ingestion_capacity: 1024
  storage_capacity: 1024
  broadcast_capacity: 256
  operation_timeout_seconds: 2.0

sessions:
  root_directory: "artifacts/sessions"   # gitignored
  flush_every_events: 1
  atomic_summary: true
  recover_incomplete_sessions: true

task:
  # Reaction-task geometry. Task telemetry is a SOFTWARE measurement.
  # It is not an engagement, attention, cognitive-load, or fatigue measure.
  blocks: 2
  trials_per_block: 10
  stimulus_duration_ms: 800.0
  response_timeout_ms: 1500.0
  inter_trial_interval_ms: 500.0
  default_difficulty: 1
  # The three values below control how the simulator FABRICATES responses.
  # They are SYNTHETIC test parameters, not a model of human performance.
  synthetic_response_latency_ms: 450.0
  synthetic_error_rate: 0.2
  synthetic_timeout_rate: 0.1

replay:
  default_speed: 1.0        # 1.0 = original timing; 0 = immediate, no sleeping
  maximum_speed: 1000.0
  preserve_original_timing: true
