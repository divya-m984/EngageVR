# EngageVR default configuration
# All values are overridable per-session or per-experiment.

project:
  name: "EngageVR"
  version: "0.1.0"

capture:
  camera_index: 0
  width: 640
  height: 480
  webcam_fps_target: 30
  store_raw_video: false   # privacy: disabled by default
  preview: false

face:
  model_path: "models/face_landmarker.task"
  min_detection_confidence: 0.5
  min_presence_confidence: 0.5
  min_tracking_confidence: 0.5
  blink_ear_threshold: 0.21
  eye_closure_min_frames: 3

head_pose:
  velocity_window_seconds: 1.0

quality:
  brightness_low: 40.0
  brightness_high: 220.0
  blur_threshold: 100.0
  motion_threshold: 30.0

# --- Remote photoplethysmography (rPPG) ---
# Heart-rate outputs are signal-processing ESTIMATES from camera data.
# They are not medical measurements and are not engagement or cognitive load.
rppg:
  method: "pos"            # green | chrom | pos

  roi:
    regions: ["forehead", "left_cheek", "right_cheek"]
    inset_fraction: 0.15   # trim toward centre: excludes hair, brows, eyes, nostrils
    min_valid_pixels: 200
    min_valid_pixel_pct: 60.0
    clipping_low: 5        # <= this is crushed black
    clipping_high: 250     # >= this is saturated

  trace:
    expected_fps: 30.0
    max_timestamp_jitter_s: 0.02
    min_valid_frame_pct: 80.0

  window:
    duration_seconds: 30.0    # specification recommends 20-30 s
    step_seconds: 1.0
    min_duration_seconds: 8.0

  preprocessing:
    detrend: true
    normalize: true
    resample_uniform: true
    filter_order: 4
    # 0.7-4.0 Hz = 42-240 BPM, following the 40-240 BPM pulse range used by
    # de Haan & Jeanne (2013), DOI 10.1109/TBME.2013.2266196.
    pulse_band_low_hz: 0.7
    pulse_band_high_hz: 4.0

  spectral:
    welch_segment_seconds: 8.0
    welch_overlap: 0.5
    peak_bandwidth_hz: 0.1
    min_relative_peak_prominence: 0.3
    min_spectral_peak_ratio: 0.15

  quality:
    threshold: 0.5           # below this, heart rate is reported unavailable
    max_illumination_cv: 0.05
    max_clipped_pixel_pct: 5.0
    max_motion_score: 30.0
    method_agreement_tolerance_bpm: 10.0

  datasets:
    # Nothing is downloaded automatically. See docs/DATASETS.md.
    ubfc_rppg_root: null

windowing:
  facial_aggregate_seconds: 5.0
  rppg_window_seconds: 30.0
  model_inference_seconds: 5.0
  baseline_calibration_seconds: 120.0

signal_quality:
  min_face_detection_confidence: 0.5
  min_rppg_quality: 0.3
  min_hrv_window_seconds: 60.0   # do not compute HRV below this

model:
  confidence_threshold: 0.5
  abstain_below_confidence: 0.3

adaptation:
  enabled: true
  cooldown_seconds: 30.0
  max_difficulty_change: 1
  require_min_signal_quality: 0.4
  require_min_confidence: 0.4

logging:
  level: "INFO"
  format: "json"
  file: null   # null = stderr only

session:
  data_dir: "data"
  synthetic_dir: "data/synthetic"

# --- Milestone 4: local real-time bridge, task simulator, storage, replay ---
# This prototype has NO authentication, authorization, or transport
# encryption. It is a localhost development server and must not be exposed.

server:
  host: "127.0.0.1"          # loopback only
  port: 8000
  allow_public_bind: false   # required before binding a non-loopback address
  maximum_message_bytes: 262144
  heartbeat_interval_seconds: 10.0
  connection_timeout_seconds: 30.0   # must exceed the heartbeat interval
  acknowledgement_timeout_seconds: 5.0

protocol:
  version: "1.0"
  accepted_major_versions: [1]
  maximum_clock_skew_seconds: 5.0
  maximum_sequence_gap: 1000
  maximum_transport_delay_seconds: 2.0

queues:
  # Every queue is bounded. A full queue drops non-critical telemetry and
  # counts the drop; it never blocks the process indefinitely and never
  # drops session_start, session_end, adaptation_command,
  # adaptation_acknowledgement, protocol_error, or task_completed.
  ingestion_capacity: 1024
  storage_capacity: 1024
  broadcast_capacity: 256
  operation_timeout_seconds: 2.0

sessions:
  root_directory: "artifacts/sessions"   # gitignored
  flush_every_events: 1
  atomic_summary: true
  recover_incomplete_sessions: true

task:
  # Reaction-task geometry. Task telemetry is a SOFTWARE measurement.
  # It is not an engagement, attention, cognitive-load, or fatigue measure.
  blocks: 2
  trials_per_block: 10
  stimulus_duration_ms: 800.0
  response_timeout_ms: 1500.0
  inter_trial_interval_ms: 500.0
  default_difficulty: 1
  # The three values below control how the simulator FABRICATES responses.
  # They are SYNTHETIC test parameters, not a model of human performance.
  synthetic_response_latency_ms: 450.0
  synthetic_error_rate: 0.2
  synthetic_timeout_rate: 0.1

replay:
  default_speed: 1.0        # 1.0 = original timing; 0 = immediate, no sleeping
  maximum_speed: 1000.0
  preserve_original_timing: true

# --- Milestone 5: windowed feature datasets and interpretable baselines ---
# Feature values are observable summaries. They are NOT engagement or
# cognitive-load measurements. Targets in this repository are SYNTHETIC only;
# no validated participant label exists.

features:
  catalog_version: "1.0"
  window_duration_seconds: 10.0
  window_step_seconds: 10.0        # equal to duration = non-overlapping
  partial_window_policy: "drop"    # drop | keep_if_minimum
  minimum_partial_duration_seconds: 0.0
  dataset_directory: "artifacts/datasets"   # gitignored

  aggregation:
    # Minimum evidence before a feature is computed at all. These are
    # software thresholds, not empirically validated cut-offs.
    min_face_frames: 5
    min_face_seconds: 1.0
    min_pose_frames: 5
    min_quality_frames: 1
    min_resolved_trials: 1
    min_reaction_times: 1
    min_rppg_windows: 1

training:
  experiment_directory: "artifacts/experiments"   # gitignored
  random_seed: 42
  folds: 5
  calibration_method: "sigmoid"        # none | sigmoid | isotonic
  calibration_group_fraction: 0.25     # carved out of TRAINING groups only
  calibration_bins: 10
  permutation_repeats: 5
  run_ablations: true
  tune_hyperparameters: false          # bounded small grid when true

# --- Milestone 6: multimodal fusion ---
# Fusion combines evidence from several measurement modalities. It does not
# make an estimate valid: no fused output has been evaluated against a real
# participant label, and no strategy below is a champion.

fusion:
  # early        - concatenate modality features, fit one estimator
  # uniform_late - one estimator per modality, equal-weight combination
  # quality_late - one estimator per modality, quality-weighted combination
  # validation_weighted_late / stacked_late are available but off by default
  enabled_strategies:
    - early
    - uniform_late
    - quality_late

  # Measurement modalities only. 'quality' is NOT a modality: capture-quality
  # diagnostics, availability flags, and missingness indicators are support
  # signals that explain a measurement rather than being one. Naming 'quality'
  # here is rejected at configuration load.
  modalities:
    - behavioural
    - head_pose
    - rppg
    - task

  minimum_modalities: 1          # fewest contributing experts before fusing
  expert_model_classification: "logistic_regression"
  expert_model_regression: "ridge"
  use_calibrated_experts: true

  # Off by default: quality's declared role is fusion weighting, and letting
  # it into every estimator silently would blur that boundary.
  include_modality_quality_in_experts: false
  include_modality_quality_in_early_fusion: false

  quality:
    enabled: true
    # exclude | documented_fallback. Neither treats missing quality as
    # perfect quality; there is no policy that does.
    missing_quality_policy: "documented_fallback"
    # Neutral midpoint of the [0, 1] quality range, recorded on every weight
    # it is used for. Some modalities have no quality channel at all: task
    # telemetry is a software measurement with no signal-quality index.
    missing_quality_fallback: 0.5
    # 0.0 excludes nothing. No empirically validated quality cut-off exists
    # for these signals, so no non-zero default could be justified.
    minimum_quality: 0.0
    # A numerical guard against normalising by ~0, not a modelling threshold.
    minimum_effective_weight: 1.0e-9
    # Empty = deterministic equal base weight of 1.0 per modality (the
    # control). No optimised weight set is shipped as a default.
    base_weights: {}

  stacking:
    enabled: false
    inner_folds: 3                 # grouped, inside the outer training portion
    meta_model_classification: "logistic_regression"
    meta_model_regression: "ridge"

  robustness:
    enabled: true
    scenarios: []                  # empty = every defined scenario
    # Synthetic dropout fabricates an availability pattern no measurement
    # produced. It is a software check and is refused in scientific mode.
    synthetic_dropout_enabled: false
    synthetic_dropout_seed: 42
    synthetic_dropout_probability: 0.0

# --- Milestone 6: personalization (population vs personalized reporting) ---
#
# Personalization adapts the POPULATION model to one subject using only that
# subject's own EARLIER windows. It is not uncertainty calibration, it is not
# a confidence estimate, and nothing here abstains: confidence thresholds and
# selective prediction are Milestone 7.
#
# Every minimum below is an engineering default, not a validated threshold.
# Below any of them the subject falls back to the population model and the
# run records a cold start with a reason.
personalization:
  # population_only | personal_baseline | few_shot_correction |
  # personal_baseline_and_correction.
  # 'cold_start' is an OUTCOME, not a method: request cold-start behaviour
  # with calibration_windows: 0.
  method: "personal_baseline_and_correction"

  # Measurement modalities feeding the fused population model. 'quality' is
  # not a modality here either.
  modalities:
    - behavioural
    - head_pose
    - rppg
    - task

  # A held-out subject's earliest windows reserved for personal calibration.
  # The evaluation region is everything that starts at or after the latest
  # calibration window's end; a window straddling that boundary is excluded
  # from both regions rather than moved.
  calibration_windows: 5

  minimum_calibration_windows: 3   # fewest labelled windows for a correction
  minimum_evaluation_windows: 1    # fewest windows after the boundary
  minimum_calibration_classes: 2   # fewest classes before a probability shift
  minimum_baseline_samples: 3      # fewest finite values before z-scoring one

  # Standard deviation at or below which a feature is centred but not scaled.
  # A numerical guard against dividing by ~0, not a modelling threshold.
  zero_variance_epsilon: 1.0e-9

  # Laplace smoothing applied identically to the observed class counts and to
  # the population model's expected counts, so the shift is exactly zero when
  # they agree.
  classification_smoothing: 1.0
  # Shrinkage constant kappa in lambda = n / (n + kappa): larger values trust
  # a small calibration set less.
  classification_shrinkage_constant: 5.0

  population_model_classification: "logistic_regression"
  population_model_regression: "ridge"
  use_calibrated_population_model: true

  # Off by default: signal quality describes the measurement, and it is never
  # normalised against a personal baseline as a physiological value.
  include_modality_quality: false
